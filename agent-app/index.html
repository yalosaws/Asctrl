<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Remote Assist</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>

  <body data-state="connecting">
    <!-- Edge glow -->
    <div id="frames" class="layer"></div>
    <!-- On-screen marks: outlines, aim rings, light trails -->
    <div id="marks" class="layer"></div>
    <!-- Work panel -->
    <div id="cards" class="layer"></div>

    <!-- Orb: anchored at its centre, position written to transform by script -->
    <div id="orb">
      <div class="orb-tail"></div>
      <div class="orb-pres">
        <div class="orb-float">
          <div class="orb-halo"></div>
          <div class="orb-aura"></div>
          <div class="orb-arc"></div>
          <div class="orb-bump">
            <div class="orb-body">
              <div class="orb-core"></div>
              <div class="orb-swirl"></div>
              <div class="orb-tint"></div>
              <div class="orb-gloss"></div>
            </div>
          </div>
        </div>
        <button id="orb-hit" aria-label="Remote Assist"></button>
        <span class="orb-tag" id="admin-tag" hidden>Admin</span>
      </div>
    </div>

    <!-- Assist code: digits only -->
    <div class="panel code-card" id="code-card" hidden>
      <div class="code" id="code" aria-live="polite"></div>
    </div>

    <!-- Hover menu -->
    <div class="panel menu" id="menu" hidden>
      <div class="menu-actions">
        <button class="btn danger" id="btn-end">End session</button>
        <button class="btn ghost" id="btn-quit">Quit</button>
      </div>
    </div>
  </body>
</html>
