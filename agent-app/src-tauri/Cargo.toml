[package]
name = "asctrl-agent"
version = "0.1.0"
description = "Asctrl 远程协助被控端"
authors = ["Asctrl"]
edition = "2024"

[lib]
# 加 _lib 后缀是为了避免 Windows 上 lib 和 bin 同名冲突
name = "asctrl_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
base64 = "0.22"
rand = "0.9"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
