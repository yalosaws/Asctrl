<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Frame</title></head>
<body style="font: 15px system-ui">
<label>Card holder <input id="holder" size="24"></label>
<p><label>Plan <select id="plan"><option>Basic</option><option>Premium</option></select></label></p>
<button id="go">Confirm order</button>
<p id="out">Not confirmed</p>
<script>
  document.getElementById("go").onclick = (e) => {
    document.getElementById("out").textContent = `Order for ${document.getElementById("holder").value} (${document.getElementById("plan").value})${e.isTrusted ? "" : " untrusted"}`;
  };
</script>
</body>
</html>
